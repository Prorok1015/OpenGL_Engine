# The Windows release package (#223), built and checked the same way for pull requests (build.yml) and
# releases (release.yml): one leg per configuration builds the static and the shared engine and packs
# Snake-<ver>-windows-x64.zip (Release: the editor, the SDK with both engines, PDBs, the MSVC runtime) or
# Snake-<ver>-windows-x64-debug.zip (the Debug engine, unpacked over the main archive); a check job
# unpacks both like a user and builds against them (tools/ci/check_windows_package.sh).
name: Windows package

on:
  workflow_call:
    inputs:
      cmake-args:
        description: Extra configure arguments for both engine builds
        type: string
        default: ""
      run-tests:
        description: Also build and run unit_tests with the shared Release engine
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Windows package (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    defaults:
      run:
        shell: bash
    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      SNK_PACKAGE_CMAKE_ARGS: ${{ inputs.cmake-args }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-package-${{ matrix.config }}

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-package-${{ matrix.config }}-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ver="${GITHUB_REF_NAME}"; else ver="${GITHUB_SHA::8}"; fi
          echo "SNK_VERSION=${ver}" >> "$GITHUB_ENV"

      - name: Build, install and pack (static and shared engine)
        run: bash tools/ci/package_windows.sh "${{ matrix.config }}" "${GITHUB_WORKSPACE}/package_out" "${SNK_VERSION}"

      # #591: the shipping host `game` on the static engine, the Windows counterpart of the Linux Clang Debug steps
      # (build.yml). The package step above built this static tree (snk_sdk), so only the host is left to compile.
      - name: Build the game host (static engine)
        run: cmake --build "build/ci-windows-msvc-static-${{ matrix.config == 'Release' && 'release' || 'debug' }}" --target game test_static_game_host --parallel

      # No display and no GPU: --headless selects the null window and the null renderer. The same checks as on Linux:
      # the start level loads, file watching and hot reload stay off, nothing is logged as an error.
      - name: Game host headless run (static engine)
        timeout-minutes: 5
        run: |
          game_dir="build/ci-windows-msvc-static-${{ matrix.config == 'Release' && 'release' || 'debug' }}/apps/game"
          mkdir -p game_out
          log=game_out/game.log
          rc=0
          timeout 120 "${game_dir}/game.exe" \
            --config apps/game/config/game.cfg --headless --project projects/sandbox \
            --set game/exit_after_level_loaded true app/exit_after_frames 20000 app/headless_target_fps 0 \
            >game_out/stdout.txt 2>"$log" || rc=$?
          tail -20 "$log"
          # What else the process wrote (a CRT assert, a crash report) goes to stdout, not to the log.
          trap 'if [ -s game_out/stdout.txt ]; then echo "stdout:"; tail -20 game_out/stdout.txt; fi' EXIT
          if [ "$rc" -ne 0 ]; then echo "::error::expected exit code 0, got $rc (124 = timed out)"; exit 1; fi
          if ! grep -q "level loaded: .*editor_level.desc" "$log"; then
            echo "::error::the start level did not load (exit_after_frames cap reached?)"; exit 1
          fi
          grep -q "exit after the level loaded (game/exit_after_level_loaded)" "$log"
          grep -q "file watching is off (res/watch_files)" "$log"
          grep -q "hot reload is off (scene/hot_reload)" "$log"
          if grep -q "watching files under" "$log"; then echo "::error::a file watcher started"; exit 1; fi
          if grep -q "watched for hot reload" "$log"; then echo "::error::the level is watched for hot reload"; exit 1; fi
          if grep -E '\[(error|critical)\]' "$log"; then echo "::error::errors in the game host log"; exit 1; fi
          trap - EXIT

      # The host imports no snk_engine.dll (it is the static engine) and no DLL beyond Windows: an editor or git library
      # would not sit next to it and fails the check. The MSVC runtime is not required next to it: the host has no
      # package yet (stage 7, #46). Its link graph is checked at configure (SnkMcpIsolation) and its symbols on Linux.
      - name: Game host dependency check (static engine)
        run: |
          bash tools/ci/check_windows_deps.sh --runtime-elsewhere \
            "build/ci-windows-msvc-static-${{ matrix.config == 'Release' && 'release' || 'debug' }}/apps/game" game.exe

      # #592: the game module compiled into the host (tests/static_game), the counterpart of the Linux step (build.yml).
      - name: Static game module headless run (static engine)
        timeout-minutes: 5
        run: |
          host_dir="build/ci-windows-msvc-static-${{ matrix.config == 'Release' && 'release' || 'debug' }}/tests/static_game"
          mkdir -p game_out
          log=game_out/static_game.log
          rc=0
          timeout 120 "${host_dir}/test_static_game_host.exe" \
            --config apps/game/config/game.cfg --headless --project tests/static_game/project \
            --set game/exit_after_level_loaded false app/exit_after_frames 120 app/headless_target_fps 60 \
            >game_out/static_game_stdout.txt 2>"$log" || rc=$?
          tail -20 "$log"
          trap 'if [ -s game_out/static_game_stdout.txt ]; then echo "stdout:"; tail -20 game_out/static_game_stdout.txt; fi' EXIT
          if [ "$rc" -ne 0 ]; then echo "::error::expected exit code 0, got $rc (124 = timed out)"; exit 1; fi
          if ! grep -q "module 'static_game' loaded" "$log"; then echo "::error::the compiled-in module was not loaded"; exit 1; fi
          if ! grep -q "level loaded: .*main.desc" "$log"; then echo "::error::the start level did not load"; exit 1; fi
          if ! grep -q "static game system ran" "$log"; then echo "::error::the module's system did not run"; exit 1; fi
          if grep -E '\[(error|critical)\]' "$log"; then echo "::error::errors in the static game host log"; exit 1; fi
          trap - EXIT

      # The unit tests on the shared Release engine (what the removed "Windows MSVC Shared Release" job ran).
      # Built in the package's shared tree (only the test sources and Boost.Test are left to compile), with no step
      # limit, as the build matrix does: a cold compiler cache makes it ~30 minutes. The run has the matrix's limit.
      - name: Build unit tests (shared Release engine)
        if: inputs.run-tests && matrix.config == 'Release'
        run: cmake --build build/ci-windows-msvc-release --target unit_tests --parallel

      - name: Run unit tests (shared Release engine)
        if: inputs.run-tests && matrix.config == 'Release'
        timeout-minutes: 10
        working-directory: build/ci-windows-msvc-release
        run: ./unit_tests --log_level=test_suite

      - name: Compiler cache statistics
        if: always()
        run: if command -v sccache >/dev/null; then sccache --show-stats; fi

      - uses: actions/upload-artifact@v4
        with:
          name: snake-windows-x64-${{ matrix.config }}
          path: package_out/Snake-*.zip
          compression-level: 0
          if-no-files-found: error

      # The configuration-independent targets files of the Debug build: the check job compares them with the Release
      # package's (the debug archive relies on those).
      - uses: actions/upload-artifact@v4
        if: matrix.config == 'Debug'
        with:
          name: sdk-debug-targets
          path: package_out/debug-targets/
          if-no-files-found: error

  check:
    name: Windows package check
    needs: package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # The consumer and the project template come from the sources; the engine only from the archives.
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/download-artifact@v4
        with:
          pattern: snake-windows-x64-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdk-debug-targets
          path: debug-targets

      - name: Unpack and check the package
        run: |
          ls -l dist
          main="$(ls dist/Snake-*-windows-x64.zip)"
          debug="$(ls dist/Snake-*-windows-x64-debug.zip)"
          bash tools/ci/check_windows_package.sh "$main" "$debug" debug-targets
