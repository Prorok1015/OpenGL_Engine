name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Windows Release package
    runs-on: windows-latest
    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      PKG: SnakeEditor
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Same preset (and cache key) as the Windows MSVC Release job in build.yml.
      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-windows-msvc-release

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-release-windows-latest-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        shell: bash
        run: cmake --preset ci-windows-msvc-release -DSNK_ASSIMP_FORMATS=ALL "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor
        run: cmake --build build/ci-windows-msvc-release --target editor --parallel

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then ver="${GITHUB_REF_NAME}"; else ver="${GITHUB_SHA::8}"; fi
          echo "VERSION=${ver}" >> "$GITHUB_ENV"

          # Layout keeps editor.cfg's `resource: path: ../res/` valid (resolved
          # relative to the cfg file): config/../res == SnakeEditor/res.
          # Engine base resources (core/res) ship as res_core/ and the packaged
          # cfg's base_path is rewritten from the in-repo ../../core/res/.
          mkdir -p "${PKG}/bin" "${PKG}/config"
          BUILD_DIR=build/ci-windows-msvc-release
          cp "${BUILD_DIR}/Editor/editor.exe" "${PKG}/bin/" || cp "$(find "${BUILD_DIR}" -name editor.exe | head -n1)" "${PKG}/bin/"
          # Runtime DLLs (libs are static by default, so normally none).
          find "${BUILD_DIR}/Editor" -maxdepth 1 -name '*.dll' -exec cp {} "${PKG}/bin/" \;
          sed 's#base_path: ../../core/res/#base_path: ../res_core/#' Editor/config/editor.cfg > "${PKG}/config/editor.cfg"
          grep -q 'base_path: ../res_core/' "${PKG}/config/editor.cfg"
          cp -r core/res "${PKG}/res_core"
          cp -r Editor/res "${PKG}/res"
          cat > "${PKG}/README.txt" <<'TXT'
          SnakeEditor - OpenGL Engine editor

          Requirements: Windows 10/11 x64, GPU with OpenGL 4.5+ drivers.

          Run from this folder:
              bin\editor.exe --config config\editor.cfg

          Keep the bin/, config/, res/ and res_core/ folders side by side: the config
          refers to the resources as ../res/ (editor layer, wins) and ../res_core/
          (engine base layer) relative to the config file. Logs are written
          to logs\ relative to the working directory. When launched from the package
          root, the log file is <package>\logs\engine.log.
          TXT
          cp LICENSE "${PKG}/" 2>/dev/null || true

          7z a -tzip -mx=5 "SnakeEditor-${ver}-windows-x64.zip" "${PKG}" > /dev/null
          ls -l SnakeEditor-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SnakeEditor-windows-x64
          path: SnakeEditor-*-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SnakeEditor-windows-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
