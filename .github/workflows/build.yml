name: Build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC Debug
            os: windows-latest
            build_type: Debug
            profile_mode: INTERNAL
          - name: Windows MSVC Release
            os: windows-latest
            build_type: Release
            profile_mode: NONE
          - name: Linux GCC Debug
            os: ubuntu-latest
            build_type: Debug
            profile_mode: INTERNAL
            cc: gcc
            cxx: g++
          - name: Linux Clang Debug
            os: ubuntu-latest
            build_type: Debug
            profile_mode: INTERNAL
            cc: clang
            cxx: clang++

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Boost 1.84 is downloaded by FetchContent (cmake/ThirdParty.cmake); cache its
      # base dir so the tarball is not re-downloaded/re-extracted on every run.
      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.cxx || 'msvc' }}-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -G Ninja
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
            -DENGINE_PROFILE_MODE=${{ matrix.profile_mode }}
            "-DFETCHCONTENT_BASE_DIR=${FC_DIR}")
          if [ "$RUNNER_OS" = "Linux" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
              -DGLFW_BUILD_WAYLAND=OFF)
          fi
          cmake "${args[@]}"

      - name: Build editor and unit_tests
        run: cmake --build build --target editor unit_tests --parallel

      # NOTE: some suites (edt_*) may touch the resource system; there is no GPU on
      # hosted runners, so this relies on the tests being headless.
      - name: Run unit tests
        working-directory: build
        shell: bash
        run: ./unit_tests --log_level=test_suite

  # Sanitizer builds (Linux only; project targets instrumented, third-party is not).
  # GCC is used because the Clang build is currently broken (see the Linux Clang Debug job).
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ASan+UBSan
            sanitize: address
            experimental: false
          - name: Linux TSan
            sanitize: thread
            experimental: false

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENGINE_PROFILE_MODE=INTERNAL \
            -DSNK_SANITIZE=${{ matrix.sanitize }} -DGLFW_BUILD_WAYLAND=OFF \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build unit_tests
        run: cmake --build build --target unit_tests --parallel

      - name: Run unit tests under sanitizer
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitizers/lsan.supp:print_suppressions=0
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/.github/sanitizers/tsan.supp
        run: ./unit_tests --log_level=test_suite
