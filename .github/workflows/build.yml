name: Build

# Every job configures through a preset from CMakePresets.json (ci-*), so CI and local builds share
# one definition. The compiler cache (ccache on Linux, sccache on MSVC) and precompiled headers are
# CMake options enabled by those presets (SNK_COMPILER_CACHE, SNK_PCH); the cache directory is
# persisted by .github/actions/compiler-cache.

on:
  # Work branches (wip/*) are checked through their draft PR into aibranch; a push trigger on them
  # too would run every job twice.
  push:
    branches: [aibranch, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # By hand on aibranch or main (Actions > Build > Run workflow): the same jobs as a push.
  workflow_dispatch:
  pull_request:
    # ready_for_review: marking a draft PR ready starts the full run (see the tiers below).
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# Two tiers. FAST runs on every PR event, drafts included, and on pushes; FULL runs only on pushes
# (and runs started by hand, which count as pushes everywhere below) and on PRs that are not drafts,
# so a non-draft PR gets one complete run. Whole-job FULL jobs carry
#   if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
# Matrix jobs that mix tiers (build, sanitizers) pick their matrix with the same condition: job-level
# `if` cannot read `matrix`, so the matrix itself is built from a fast or a full JSON list.
# Fast: Coverage (Linux GCC Debug, also runs the source gates), Linux Clang Debug, Windows MSVC Debug, Linux ASan+UBSan, Linux GCC no Assimp, Editor visual smoke.
# Full adds: Linux GCC Shared (the project template's game module, #434), Linux TSan, SDK package (Linux),
# Windows package (Release, Debug, check: the release archives, #223), Extract benchmark (#505: on a PR it only
# builds, so a warning that only the optimized GCC build shows fails the PR; the benchmark runs and reports on pushes
# and by hand only). Every build uses the shared engine but Linux Clang Debug and the static SDK halves (#223).

# A newer push to a PR cancels its running run. A push run (aibranch, main) is never cancelled once it
# runs, or frequent merges would leave the branch without a single complete run (#476): the benchmark
# job runs only there. GitHub still keeps one waiting run per group, so a run that has not started yet
# gives way to the newer push.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PCH is off in the ci-linux-clang-debug preset: it catches headers that compile only thanks to the PCH.
      # It is also the one static-engine build with the unit tests (#223); a static build has no editor executable, but it
      # has the shipping host `game` (#591), which runs the sandbox's start level headless below.
      # The same two jobs in both tiers: the Windows Release builds moved to the Windows package jobs (#223).
      matrix:
        include:
          - { name: "Windows MSVC Debug", os: windows-latest, preset: ci-windows-msvc-debug }
          - { name: "Linux Clang Debug", os: ubuntu-latest, preset: ci-linux-clang-debug, targets: unit_tests game }

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-${{ matrix.preset }}

      # Boost 1.84 is downloaded by FetchContent (cmake/ThirdParty.cmake); cache its
      # base dir so the tarball is not re-downloaded/re-extracted on every run.
      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-${{ matrix.preset }}-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      # The preset pins the compiler (#585): the runner image's default clang++ moved from 18 to 21 unannounced.
      - name: Check the pinned Clang is installed
        if: matrix.preset == 'ci-linux-clang-debug'
        shell: bash
        run: |
          if ! command -v clang++-21 >/dev/null; then
            echo "::error::clang++-21 (CMakePresets.json, ci-linux-clang-debug) is not on the runner; installed: $(ls /usr/bin/clang++-* 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          clang++-21 --version

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor and unit_tests
        run: cmake --build build/${{ matrix.preset }} --target ${{ matrix.targets || 'editor unit_tests' }} --parallel

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then sccache --show-stats; fi
          if command -v ccache >/dev/null; then ccache -s; fi

      # NOTE: some suites (edt_*) may touch the resource system; there is no GPU on
      # hosted runners, so this relies on the tests being headless.
      - name: Run unit tests
        timeout-minutes: 10
        working-directory: build/${{ matrix.preset }}
        shell: bash
        run: ./unit_tests --log_level=test_suite

      # #591: the shipping host on the static engine runs the project's start level (sandbox: levels/editor_level.desc)
      # with no display. game/exit_after_level_loaded ends the run with 0 once "level loaded" is logged;
      # app/exit_after_frames is only the cap. The host switches off file watching and hot reload itself.
      - name: Game host headless run
        if: matrix.preset == 'ci-linux-clang-debug'
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p game_out
          log=game_out/game.log
          rc=0
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 120 build/ci-linux-clang-debug/apps/game/game \
            --config apps/game/config/game.cfg --headless --project projects/sandbox \
            --set game/exit_after_level_loaded true app/exit_after_frames 20000 app/headless_target_fps 0 \
            >game_out/stdout.txt 2>"$log" || rc=$?
          tail -20 "$log"
          if [ "$rc" -ne 0 ]; then echo "::error::expected exit code 0, got $rc (124 = timed out)"; exit 1; fi
          if ! grep -q "level loaded: .*editor_level.desc" "$log"; then
            echo "::error::the start level did not load (exit_after_frames cap reached?)"; exit 1
          fi
          grep -q "exit after the level loaded (game/exit_after_level_loaded)" "$log"
          grep -q "file watching is off (res/watch_files)" "$log"
          grep -q "hot reload is off (scene/hot_reload)" "$log"
          if grep -q "watching files under" "$log"; then echo "::error::a file watcher started"; exit 1; fi
          if grep -E '\[(error|critical)\]' "$log"; then echo "::error::errors in the game host log"; exit 1; fi

      # #591: the host links no editor, MCP or git code and does not load snk_engine (it is the static engine).
      - name: Game host dependency check
        if: matrix.preset == 'ci-linux-clang-debug'
        shell: bash
        run: bash tools/ci/check_game_deps.sh build/ci-linux-clang-debug/apps/game/game

  # The shared engine (snk_engine, the default since #223) with the project template's game module built against the
  # build tree SDK and loaded by the editor. Windows: the Windows package jobs below. FULL tier.
  shared:
    name: Linux GCC Shared
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      # Configures without a preset (the package consumer, the project template) take the same pinned GCC (#585).
      CC: gcc-15
      CXX: g++-15
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            xvfb libgl1-mesa-dri xdotool imagemagick

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          # Not the smoke job's key, though it builds the same preset: two jobs saving one key in a run collide (#582).
          key: cc-ci-linux-gcc-shared

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Configure
        run: cmake --preset ci-linux-gcc-debug "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor and unit_tests
        run: cmake --build build/ci-linux-gcc-debug --target editor unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Run unit tests
        timeout-minutes: 10
        working-directory: build/ci-linux-gcc-debug
        run: ./unit_tests --log_level=test_suite

      # The project template's game module (#434), built against this build tree's SDK (<build>/snake_sdk, no
      # cmake --install) in both configurations; DebugGame last, the one that matches this Debug engine.
      - name: Build the project template's game module against the build tree SDK
        run: |
          cmake --build build/ci-linux-gcc-debug --target snk_sdk --parallel
          proj="${RUNNER_TEMP}/template_project"
          rm -rf "$proj"
          cp -r Editor/data/templates/projects/empty "$proj"
          export SNAKE_SDK_DIR="${GITHUB_WORKSPACE}/build/ci-linux-gcc-debug/snake_sdk"
          for preset in release debuggame; do
            (cd "$proj/code" && cmake --preset "$preset" && cmake --build --preset "$preset")
          done
          ls -l "$proj/build/bin"
          test -f "$proj/build/bin/libgame.so"
          if ls "$proj/build/bin" | grep -q "gamed\."; then echo "::error::the module has a debug postfix"; exit 1; fi

      # The shared editor opens the project and loads the module from build/bin (#428). The template's
      # engine_version is a placeholder (New Project stamps the real one), hence the mismatch flag.
      - name: The editor loads the template's game module
        run: |
          tools/run_headless.sh --editor build/ci-linux-gcc-debug/Editor/editor --frames 30 --shot headless_out/template/final.png \
            -- --project "${RUNNER_TEMP}/template_project" --allow-engine-version-mismatch
          grep -E "module 'game' (loaded|refused)" headless_out/template/editor.log || true
          grep -q "module 'game' loaded" headless_out/template/editor.log

      - name: Upload the template run log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-module-log
          path: headless_out/template/
          if-no-files-found: warn

  # SNK_WITH_ASSIMP=OFF (EPIC-41 US-41-7, #105): assimp is not configured, the model importer and the editor
  # model import are not compiled. Cheap (no assimp to build), so FAST tier: it is the only guard that keeps the option
  # from rotting. The SDK checks (nothing of assimp installed or exported, the consumer still builds) run in the FULL tier.
  no-assimp:
    name: Linux GCC no Assimp
    runs-on: ubuntu-latest

    env:
      # Configures without a preset (the package consumer, the project template) take the same pinned GCC (#585).
      CC: gcc-15
      CXX: g++-15
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      SDK_PREFIX: ${{ github.workspace }}/sdk-install-no-assimp

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-no-assimp

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Configure
        run: cmake --preset ci-linux-no-assimp "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Check assimp is not part of the build
        run: |
          if grep -q '^ASSIMP_' build/ci-linux-no-assimp/CMakeCache.txt; then
            echo "::error::assimp was configured although SNK_WITH_ASSIMP=OFF"
            exit 1
          fi

      - name: Build editor and unit_tests
        run: cmake --build build/ci-linux-no-assimp --target editor unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Run unit tests
        timeout-minutes: 10
        working-directory: build/ci-linux-no-assimp
        run: ./unit_tests --log_level=test_suite

      - name: Build SDK targets
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: cmake --build build/ci-linux-no-assimp --target snk_sdk --parallel

      - name: Install SDK
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: cmake --install build/ci-linux-no-assimp --prefix "${SDK_PREFIX}" --component snake_sdk

      - name: Check the SDK has no assimp
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          if grep -rIil assimp "${SDK_PREFIX}/lib/cmake"; then
            echo "::error::the package config mentions assimp"
            exit 1
          fi
          if find "${SDK_PREFIX}/lib" -iname '*assimp*' | grep -q .; then
            echo "::error::assimp was installed"
            exit 1
          fi

      - name: Configure consumer
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: |
          cmake -S tests/package_consumer -B build/consumer-no-assimp -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=${SDK_PREFIX}" -DSNK_CONSUMER_HEADER_CHECK=ON

      - name: Build consumer
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: cmake --build build/consumer-no-assimp

      - name: Run consumer
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: build/consumer-no-assimp/package_consumer

  # Sanitizer builds (Linux only; project targets instrumented, third-party is not).
  # GCC is used because the Clang build is currently broken (see the Linux Clang Debug job).
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      # ASan+UBSan is FAST, TSan is FULL: the matrix is the fast or the full list (see the tiers above).
      matrix:
        include: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.draft == false) && '[{"name":"Linux ASan+UBSan","preset":"ci-linux-asan","experimental":false},{"name":"Linux TSan","preset":"ci-linux-tsan","experimental":false}]' || '[{"name":"Linux ASan+UBSan","preset":"ci-linux-asan","experimental":false}]') }}

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-${{ matrix.preset }}

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build unit_tests
        run: cmake --build build/${{ matrix.preset }} --target unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Run unit tests under sanitizer
        # TSan runs the null-backend scene tests ~10x slower (about 30-60 s each) and the whole run took 23 of the former
        # 25 minutes, so a runner 10% slower timed out (#524); the limit only guards against hangs.
        timeout-minutes: 40
        working-directory: build/${{ matrix.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitizers/lsan.supp:print_suppressions=0
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/.github/sanitizers/tsan.supp
        run: |
          set -o pipefail
          ./unit_tests --log_level=test_suite --color_output=no 2>&1 | tee unit_tests.log

      # Where the budget goes: also after a failure or a timeout (the log holds the suites that finished).
      - name: Slowest test suites
        if: always()
        working-directory: build/${{ matrix.preset }}
        run: |
          [ -f unit_tests.log ] || exit 0
          sed -nE 's/.*Leaving test suite "([^"]+)"; testing time: ([0-9]+)(us|ms|s)\b.*/\1 \2 \3/p' unit_tests.log \
            | awk '$1 != "Master" { t = $2; if ($3 == "us") t /= 1e6; else if ($3 == "ms") t /= 1e3; printf "%9.1f s  %s\n", t, $1 }' \
            | sort -rn | head -n 10

  coverage:
    name: Coverage (Linux GCC Debug)
    runs-on: ubuntu-latest

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # RHI R0: GL stays inside the GL driver plus the documented allow-list; runs first, it needs no build.
      - name: Check GL is used only inside the GL driver
        run: tools/ci/check_no_gl_outside_drivers.sh

      # AI A6a: the MCP server module (snk_mcp_server) is wired into the editor and its tests only, never into the engine, a
      # game or the SDK, and it stays free of the engine; also runs first. The same rule is a CMake check in every configure
      # (cmake/SnkMcpIsolation.cmake), and the SDK jobs below check the installed package.
      - name: Check the MCP server module is isolated
        run: tools/ci/check_mcp_isolation.sh

      # #582: the root CMakeLists.txt refuses a build directory that holds the sources, before any configure work
      # (no compiler check, no submodules needed). The guard's own text must be the reason; CMake reflows it.
      - name: Check an in-source configure is refused
        run: |
          src="${RUNNER_TEMP}/insource/src"
          mkdir -p "$src"
          git archive HEAD | tar -x -C "$src"
          for bin in "$src" "$(dirname "$src")"; do
            if cmake -S "$src" -B "$bin" > "${RUNNER_TEMP}/insource.log" 2>&1; then
              echo "::error::configuring $src into $bin succeeded"; cat "${RUNNER_TEMP}/insource.log"; exit 1
            fi
            if ! tr -s ' \n' ' ' < "${RUNNER_TEMP}/insource.log" | grep -qF "snake: in-source builds are not supported (#582)"; then
              echo "::error::configuring $src into $bin failed, but not on the in-source guard"; cat "${RUNNER_TEMP}/insource.log"; exit 1
            fi
            echo "refused: -S $src -B $bin"
            rm -rf "$bin/CMakeCache.txt" "$bin/CMakeFiles"
          done

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
          python3 -m pip install --user gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-coverage

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-coverage-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Configure (--coverage)
        run: cmake --preset ci-linux-coverage "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build unit_tests
        run: cmake --build build/ci-linux-coverage --target unit_tests --parallel

      # Generic desc serialization must reproduce the committed files byte for byte (EPIC-16 #233);
      # --check lists every file whose re-serialized bytes differ and exits 1 if there is any.
      - name: Build desc_resave
        run: cmake --build build/ci-linux-coverage --target desc_resave --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      # Keep going when a test fails: a coverage report of a red run is still useful, and the
      # step fails at the end so the job is red. The job is blocking: it carries the GL-only and desc byte-stability gates; only the report steps are continue-on-error.
      - name: Run unit tests
        timeout-minutes: 10
        working-directory: build/ci-linux-coverage
        run: |
          set +e
          ./unit_tests
          echo "UNIT_TESTS_EXIT=$?" >> "$GITHUB_ENV"

      - name: Generate coverage report
        continue-on-error: true  # report tooling may flake; says nothing about the code
        run: |
          mkdir -p build/coverage
          # Product code only: engine/core libraries and the editor. Third-party code, the tests
          # themselves and build output are excluded. Multi-threaded tests can produce negative
          # hit counts and header templates repeat across TUs, hence the tolerance flags.
          # gcov must match the compiler: the pinned GCC of the ci-linux presets (#585).
          gcovr_args=(--root . --object-directory build/ci-linux-coverage --gcov-executable gcov-15
            --filter 'core/' --filter 'Editor/code/'
            --exclude 'lib3dparty/' --exclude 'tests/' --exclude 'build/' --exclude '.fetchcontent-cache/'
            --exclude-unreachable-branches --exclude-throw-branches
            --merge-mode-functions=separate
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
            --gcov-ignore-errors=no_working_dir_found
            -j "$(nproc)")
          gcovr "${gcovr_args[@]}" --txt build/coverage/coverage.txt --print-summary \
            --json-summary build/coverage/summary.json \
            --html-details build/coverage/index.html
          {
            python3 .github/scripts/coverage_summary.py build/coverage/summary.json
            echo
            echo '<details><summary>Per-file report</summary>'
            echo
            echo '```'
            cat build/coverage/coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage
          if-no-files-found: warn

      - name: Check desc files are byte-stable
        shell: bash
        run: |
          tool=build/ci-linux-coverage/tools/desc_resave/desc_resave
          status=0
          echo "::group::core/res"
          "$tool" core/res --check || status=1
          echo "::endgroup::"
          echo "::group::projects/sandbox/res + Editor/data"
          "$tool" projects/sandbox/res --base core/res --edt Editor/data --check || status=1
          echo "::endgroup::"
          exit $status

      - name: Fail if unit tests failed
        if: env.UNIT_TESTS_EXIT != '0'
        run: |
          echo "unit_tests exited with ${UNIT_TESTS_EXIT}"
          exit 1

  # Starts the editor on levels/smoke_level.desc under Xvfb + Mesa llvmpipe and checks that it
  # survives, logs no errors and actually draws the scene (tools/headless/check_smoke.sh). The screenshots
  # are also compared with tools/headless/reference/*.png; a comparison above the limit fails the job (owner decision 2026-10-19, #260).
  # --frames 120: constant frame dt and scene time frozen after 120 frames, so the animation phase of a
  # shot does not depend on runner speed (the references are only comparable that way).
  editor-smoke:
    name: Editor visual smoke (Linux)
    runs-on: ubuntu-latest

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      EDITOR_BIN: ${{ github.workspace }}/build/ci-linux-gcc-debug/Editor/editor

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            xvfb libgl1-mesa-dri xdotool imagemagick

      # Own ccache key; the preset is the one the removed Linux GCC Debug build job used.
      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-gcc-debug

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Configure
        run: cmake --preset ci-linux-gcc-debug "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor
        run: cmake --build build/ci-linux-gcc-debug --target editor --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      # #403: a non-interactive run (-n) refuses a project of another engine version before any window opens and
      # exits with code 3. timeout turns a hang (waiting on a dialog nobody answers) into a failed step, not a stuck job.
      - name: Non-interactive run refuses a newer project (exit 3)
        run: |
          mkdir -p headless_out/non_interactive
          log=headless_out/non_interactive/editor.log
          rc=0
          timeout 60 "$EDITOR_BIN" --config Editor/config/editor.cfg --project tests/data/projects/newer_engine -n >"$log" 2>&1 || rc=$?
          tail -20 "$log"
          if [ "$rc" -ne 3 ]; then echo "expected exit code 3, got $rc (124 = timed out)"; exit 1; fi
          grep -q "a non-interactive run does not ask" "$log"

      # #452: --headless runs with no display at all (no Xvfb, DISPLAY unset): a null window, the null renderer, no
      # panels. stdout stays empty (it is reserved for a protocol), the log goes to stderr. The level load is async and
      # logs nothing else on success: editor/exit_after_level_loaded ends the run with 0 once "level loaded" is logged,
      # app/exit_after_frames is only the cap (reaching it means the level never loaded; the frame limiter is off so the
      # cap comes before the timeout). Without --project the run
      # is a project error (exit 2).
      - name: Headless run (no display)
        run: |
          mkdir -p headless_out/headless
          out=headless_out/headless/stdout.txt
          err=headless_out/headless/stderr.log
          rc=0
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 120 "$EDITOR_BIN" --config Editor/config/editor.cfg --headless \
            --project projects/sandbox --set editor/startup_level levels/smoke_level.desc \
            editor/exit_after_level_loaded true app/exit_after_frames 20000 app/headless_target_fps 0 \
            >"$out" 2>"$err" || rc=$?
          tail -20 "$err"
          if [ "$rc" -ne 0 ]; then echo "expected exit code 0, got $rc (124 = timed out)"; exit 1; fi
          if [ -s "$out" ]; then echo "::error::stdout is not empty:"; head -20 "$out"; exit 1; fi
          grep -q "headless: no display; agent actions run without a human" "$err"
          if ! grep -q "level loaded: .*smoke_level.desc" "$err"; then
            echo "::error::the startup level did not load (exit_after_frames cap reached?)"; exit 1
          fi
          grep -q "exit after the level loaded" "$err"
          if grep -E '\[(error|critical)\]' "$err"; then echo "::error::errors in the headless log"; exit 1; fi

          rc=0
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 60 "$EDITOR_BIN" --config Editor/config/editor.cfg --headless \
            >headless_out/headless/no_project.stdout 2>headless_out/headless/no_project.log || rc=$?
          tail -5 headless_out/headless/no_project.log
          if [ "$rc" -ne 2 ]; then echo "expected exit code 2 without --project, got $rc"; exit 1; fi
          grep -q -- "--headless needs --project" headless_out/headless/no_project.log

      # MCP over stdio (#452): an agent drives the headless editor through its stdin/stdout. Every stdout line must be
      # JSON-RPC, problems_list must answer, Play must start, step 2 frames and stop (#491), and closing stdin must end
      # the editor with 0.
      - name: Headless MCP over stdio
        run: |
          mkdir -p headless_out/mcp_stdio
          err=headless_out/mcp_stdio/stderr.log
          rc=0
          env -u DISPLAY -u WAYLAND_DISPLAY timeout 240 python3 tools/headless_mcp_smoke.py --editor "$EDITOR_BIN" \
            --stderr "$err" --play -- --config Editor/config/editor.cfg --project projects/sandbox || rc=$?
          tail -20 "$err" || true
          if [ "$rc" -ne 0 ]; then echo "::error::the MCP stdio smoke failed (rc $rc, 124 = timed out)"; exit 1; fi
          grep -q "agent server: MCP over stdin/stdout" "$err"
          if grep -E '\[(error|critical)\]' "$err"; then echo "::error::errors in the headless MCP log"; exit 1; fi

      - name: Smoke run (smoke_level)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --size 1600x900 --shot headless_out/smoke/final.png \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/smoke/final.png headless_out/smoke/editor.log \
            200x200+860+450 0.055 tools/headless/reference/smoke.png

      # The same run on a copy of the test project outside the repository (EPIC-42 #157): nothing in the engine or the
      # editor may reach the project's files through a path of the repository. Same reference picture.
      - name: Smoke run (project outside the repository)
        run: |
          copy="${RUNNER_TEMP}/sandbox_copy"
          rm -rf "$copy"
          cp -r projects/sandbox "$copy"
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --size 1600x900 --shot headless_out/outside/final.png \
            -- --project "$copy" --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/outside/final.png headless_out/outside/editor.log \
            200x200+860+450 0.055 tools/headless/reference/smoke.png
          grep -q "opened project 'Sandbox' (${copy}/project.snkproj)" headless_out/outside/editor.log

      # Click-driven scenario (zoom, select, toolbar, light selection); a crash or error log fails it.
      - name: Smoke run (checklist actions)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --actions tools/headless/smoke_checklist.actions --size 1920x1080 \
            --shot headless_out/checklist/final.png \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/checklist/final.png headless_out/checklist/editor.log \
            200x200+860+450 0 tools/headless/reference/checklist.png

      # Game view opened at startup (editor/show_game_view): it docks to the right half of the central
      # area and must show the "Game Camera" of smoke_level, so a crop of that panel cannot be flat.
      - name: Smoke run (Game view)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --size 1600x900 --shot headless_out/game_view/final.png \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_level.desc editor/show_game_view true
          tools/headless/check_smoke.sh headless_out/game_view/final.png headless_out/game_view/editor.log \
            200x200+940+260 0.03 tools/headless/reference/game_view.png

      # Two worlds in one level (WORLD_MESSAGING W4, #272): "3d_scene" on render layer 0 and "overlay" on layer 1 (an
      # orthographic camera that clears only the depth). The Game view shows their shared texture: the overlay
      # robot must sit over the 3D scene, which must not be wiped.
      - name: Smoke run (two worlds, Game view)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --size 1600x900 --shot headless_out/two_worlds/final.png \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_two_worlds.desc editor/show_game_view true
          tools/headless/check_smoke.sh headless_out/two_worlds/final.png headless_out/two_worlds/editor.log \
            320x360+980+180 0.03 tools/headless/reference/two_worlds.png

      # #518: --game loads the start level behind a neutral loading screen and then enters game mode, which starts Play.
      # No picture is compared (the shot is only kept in the artifact). run_headless.sh --frames waits for "deterministic
      # scene settled" (no pending loads or main-thread tasks; Play adds none that stay), then --wait-for-log for the
      # controller's INFO "game mode". app/exit_after_frames is only a cap: run_headless.sh needs
      # the editor alive for its shot and stops it itself.
      - name: Smoke run (game mode)
        run: |
          log=headless_out/game_mode/editor.log
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --size 1600x900 --shot headless_out/game_mode/final.png \
            --wait-for-log '\[editor\] game mode$' \
            -- --project projects/sandbox --game=res://levels/smoke_level.desc --set app/exit_after_frames 20000
          if ! grep -q "level loaded: .*smoke_level.desc" "$log"; then
            echo "::error::the start level did not load"; tail -20 "$log"; exit 1
          fi
          if ! grep -qE "\[editor\] game mode$" "$log"; then
            echo "::error::the editor did not enter game mode"; tail -20 "$log"; exit 1
          fi
          if grep -E '\[(error|critical)\]' "$log"; then echo "::error::errors in the game mode log"; exit 1; fi

      # The same deterministic run, but the picture is taken inside the process: capture/on_settled makes the editor
      # run the command viewport.capture (rnd::driver::read_texture -> PNG) once the scene settled. It is the Scene
      # view alone (no panels, gizmos or overlays), so it has its own reference, made from this same path
      # (the reference is the capture scaled to 400 px wide).
      - name: Capture run (viewport.capture)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --size 1600x900 --shot headless_out/capture/final.png \
            --wait-for-log 'captured viewport' \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_level.desc capture/on_settled "$PWD/headless_out/capture/scene.png"
          tools/headless/check_smoke.sh headless_out/capture/scene.png headless_out/capture/editor.log \
            100x100+100+100 0 tools/headless/reference/capture_scene.png

      # #419: the click-driven editor actions behind US-36-2/#165. File -> New Level and "+" (a new world) each log their
      # success (Editor/NewLevel, Editor/CreateWorld) and, when they fail, a line of the same category; the Asset Browser
      # drag-drop onto the viewport logs "Added '...' to scene" (Editor/Drop). The screenshots of every step are in the
      # artifact; no reference image is compared (the layouts differ from the checklist reference on purpose).
      - name: Smoke run (New Level, new world)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --actions tools/headless/new_level_world.actions --size 1920x1080 \
            --shot headless_out/new_level_world/final.png \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/new_level_world/final.png headless_out/new_level_world/editor.log 200x200+860+450 0
          tools/headless/check_log.sh headless_out/new_level_world/editor.log 'Editor/NewLevel|Editor/CreateWorld' \
            'Created a new level with [0-9]+ world' "Created world 'world2'"

      - name: Smoke run (drag-drop from the Asset Browser)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --frames 120 --actions tools/headless/drag_drop_asset.actions --size 1920x1080 \
            --shot headless_out/drag_drop/final.png \
            -- --project projects/sandbox --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/drag_drop/final.png headless_out/drag_drop/editor.log 200x200+860+450 0
          tools/headless/check_log.sh headless_out/drag_drop/editor.log 'Editor/Drop' "Added 'base_material' to scene"

      - name: Upload screenshots, diff images and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-smoke
          path: headless_out
          if-no-files-found: warn

  # Report-only (RHI.md section 4, owner decision Q5): hosted runners are too noisy to gate on timings.
  # Runs the extract benchmark (tests/app_engine_null_backend_bench.cpp) on the null backend in an
  # optimized build, prints the table into the job summary and uploads the JSON. FULL tier. On a PR it
  # only builds (#505): the optimized GCC build with -Werror sees warnings no other job does (#476), and
  # a failing build fails the PR. On a push continue-on-error keeps a failure here from failing the
  # workflow.
  extract-bench:
    name: Extract benchmark (Linux, report-only)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'pull_request' }}

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      BENCH_DIR: ${{ github.workspace }}/bench_out

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev jq

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-gcc-release

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Release-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      - name: Configure
        run: cmake --preset ci-linux-gcc-release "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build unit_tests
        run: cmake --build build/ci-linux-gcc-release --target unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Run extract benchmark
        if: github.event_name != 'pull_request'
        working-directory: build/ci-linux-gcc-release
        run: |
          set -o pipefail
          mkdir -p "$BENCH_DIR"
          SNK_BENCH_JSON="$BENCH_DIR/bench_extract.json" ./unit_tests \
            --run_test=AppEngineNullBackendBench/ExtractRenderDataOnHundredMeshes --log_level=message \
            2>&1 | tee "$BENCH_DIR/bench_extract.log"

      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          if [ -f "$BENCH_DIR/bench_extract.json" ]; then
            tools/ci/bench_extract_summary.sh "$BENCH_DIR/bench_extract.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "no bench_extract.json: the benchmark did not finish" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: extract-bench
          path: bench_out
          if-no-files-found: warn

  # Installs the SDK (cmake --install, package `snake_sdk`) and builds tests/package_consumer
  # against it with find_package: proves the export set is complete and self-contained (third-party
  # libraries are bundled). The static and the shared engine go into one prefix, and the consumer links each. FULL tier.
  sdk-package:
    name: SDK package (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      # Configures without a preset (the package consumer, the project template) take the same pinned GCC (#585).
      CC: gcc-15
      CXX: g++-15
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      SDK_PREFIX_STATIC: ${{ github.workspace }}/sdk-install-static
      SDK_PREFIX_SHARED: ${{ github.workspace }}/sdk-install-shared
      SDK_PREFIX: ${{ github.workspace }}/sdk-install

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-sdk-linux

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Boost tarball
        uses: ./.github/actions/boost-tarball

      # Both engines are built and installed twice: each into its own prefix (to check that they can share one), and
      # both into SDK_PREFIX, static first, the way the release package is put together (#223).
      - name: Configure (static)
        run: cmake --preset ci-linux-static "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      # snk_sdk builds exactly the targets the install step copies.
      - name: Build SDK targets (static)
        run: cmake --build build/ci-linux-static --target snk_sdk --parallel

      # Its own Boost build directory (the static tree's compiles Boost with other definitions); the sources are shared.
      - name: Configure (shared)
        run: |
          cmake --preset ci-linux-gcc-debug "-DFETCHCONTENT_BASE_DIR=${FC_DIR}/ci-linux-gcc-debug" \
            "-DFETCHCONTENT_SOURCE_DIR_BOOST=${FC_DIR}/boost-src"

      - name: Build SDK targets (shared)
        run: cmake --build build/ci-linux-gcc-debug --target snk_sdk --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Install SDK (static, shared, both into one prefix)
        run: |
          cmake --install build/ci-linux-static --prefix "${SDK_PREFIX_STATIC}" --component snake_sdk
          cmake --install build/ci-linux-gcc-debug --prefix "${SDK_PREFIX_SHARED}" --component snake_sdk
          cmake --install build/ci-linux-static --prefix "${SDK_PREFIX}" --component snake_sdk
          cmake --install build/ci-linux-gcc-debug --prefix "${SDK_PREFIX}" --component snake_sdk
          find "${SDK_PREFIX}/lib" -maxdepth 2 | sort

      # The second install may only rewrite the headers and the package config, with the same content.
      - name: Check the two engines share one prefix
        run: tools/ci/check_sdk_merge.sh "${SDK_PREFIX_STATIC}" "${SDK_PREFIX_SHARED}"

      # Fails the job when an installed header is missing, misplaced or leaks internal paths; see the script.
      - name: Check the installed headers
        run: tools/ci/check_sdk_headers.sh "${SDK_PREFIX}"

      # The MCP server module is for the editor only: nothing of it in the installed SDK.
      - name: Check the SDK has no MCP server module
        run: tools/ci/check_mcp_isolation.sh --sdk "${SDK_PREFIX}"

      - name: Check the package does not point into the build or source tree
        run: |
          find "${SDK_PREFIX}/lib/cmake/snake_sdk" -type f | sort
          if grep -rIn -e "${GITHUB_WORKSPACE}" "${SDK_PREFIX}/lib/cmake"; then
            echo "::error::installed package config references the workspace"
            exit 1
          fi

      # System libraries found by find_library (GLFW: rt, m) must not be exported by full path (#239).
      - name: Check the package has no absolute paths
        run: tools/ci/check_sdk_abs_paths.sh "${SDK_PREFIX}"

      # The shared set exports the components usage-only: no archive next to snk_engine (#581).
      - name: Check the shared set links no archive besides the engine
        run: |
          python3 tools/ci/check_sdk_shared_set.py --self-test
          python3 tools/ci/check_sdk_shared_set.py "${SDK_PREFIX}"

      - name: Build and run the consumer against each engine
        run: |
          for engine in static shared; do
            cmake -S tests/package_consumer -B "build/consumer-${engine}" -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              "-DCMAKE_PREFIX_PATH=${SDK_PREFIX}" "-DSNK_CONSUMER_ENGINE=${engine}" -DSNK_CONSUMER_HEADER_CHECK=ON
            cmake --build "build/consumer-${engine}"
            "build/consumer-${engine}/package_consumer"
          done

  # The Windows release package (#223): Release and Debug legs build the static and the shared engine and pack the two
  # archives, a check job unpacks them like a user (the consumer against both engines, the template's game module,
  # dumpbin, editor.exe --headless from the unpacked folder). release.yml runs the same workflow. FULL tier.
  windows-package:
    name: Windows package
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/windows-package.yml
    with:
      run-tests: true
