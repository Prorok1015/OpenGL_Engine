name: Build

# Every job configures through a preset from CMakePresets.json (ci-*), so CI and local builds share
# one definition. The compiler cache (ccache on Linux, sccache on MSVC) and precompiled headers are
# CMake options enabled by those presets (SNK_COMPILER_CACHE, SNK_PCH); the cache directory is
# persisted by .github/actions/compiler-cache.

on:
  # Work branches (wip/*) are checked through their draft PR into aibranch; a push trigger on them
  # too would run every job twice.
  push:
    branches: [aibranch, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC Debug
            os: windows-latest
            preset: ci-windows-msvc-debug
          - name: Windows MSVC Release
            os: windows-latest
            preset: ci-windows-msvc-release
          - name: Windows MSVC Shared
            os: windows-latest
            preset: ci-windows-msvc-shared
          - name: Windows MSVC Shared Release
            os: windows-latest
            preset: ci-windows-msvc-shared-release
          - name: Linux GCC Debug
            os: ubuntu-latest
            preset: ci-linux-gcc-debug
          # PCH is off in this preset: it catches headers that compile only thanks to the PCH.
          - name: Linux Clang Debug
            os: ubuntu-latest
            preset: ci-linux-clang-debug

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-${{ matrix.preset }}

      # Boost 1.84 is downloaded by FetchContent (cmake/ThirdParty.cmake); cache its
      # base dir so the tarball is not re-downloaded/re-extracted on every run.
      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-${{ matrix.preset }}-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }} "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor and unit_tests
        run: cmake --build build/${{ matrix.preset }} --target editor unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null; then sccache --show-stats; fi
          if command -v ccache >/dev/null; then ccache -s; fi

      # NOTE: some suites (edt_*) may touch the resource system; there is no GPU on
      # hosted runners, so this relies on the tests being headless.
      - name: Run unit tests
        working-directory: build/${{ matrix.preset }}
        shell: bash
        run: ./unit_tests --log_level=test_suite

  # One shared snk_engine library instead of static components (EPIC-29 #59). The Windows MSVC
  # variant is the 'Windows MSVC Shared' entry of the build matrix above.
  shared:
    name: Linux GCC Shared
    runs-on: ubuntu-latest

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-shared

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        run: cmake --preset ci-linux-shared "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor and unit_tests
        run: cmake --build build/ci-linux-shared --target editor unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Run unit tests
        working-directory: build/ci-linux-shared
        run: ./unit_tests --log_level=test_suite

  # Sanitizer builds (Linux only; project targets instrumented, third-party is not).
  # GCC is used because the Clang build is currently broken (see the Linux Clang Debug job).
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ASan+UBSan
            preset: ci-linux-asan
            experimental: false
          - name: Linux TSan
            preset: ci-linux-tsan
            experimental: false

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-${{ matrix.preset }}

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build unit_tests
        run: cmake --build build/${{ matrix.preset }} --target unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Run unit tests under sanitizer
        working-directory: build/${{ matrix.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/sanitizers/lsan.supp:print_suppressions=0
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1 suppressions=${{ github.workspace }}/.github/sanitizers/tsan.supp
        run: ./unit_tests --log_level=test_suite

  coverage:
    name: Coverage (Linux GCC Debug)
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
          python3 -m pip install --user gcovr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-coverage

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-coverage-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure (--coverage)
        run: cmake --preset ci-linux-coverage "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build unit_tests
        run: cmake --build build/ci-linux-coverage --target unit_tests --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      # Keep going when a test fails: a coverage report of a red run is still useful, and the
      # step fails at the end so the job is flagged (the job itself is non-blocking).
      - name: Run unit tests
        working-directory: build/ci-linux-coverage
        run: |
          set +e
          ./unit_tests
          echo "UNIT_TESTS_EXIT=$?" >> "$GITHUB_ENV"

      - name: Generate coverage report
        run: |
          mkdir -p build/coverage
          # Product code only: engine/core libraries and the editor. Third-party code, the tests
          # themselves and build output are excluded. Multi-threaded tests can produce negative
          # hit counts and header templates repeat across TUs, hence the tolerance flags.
          gcovr_args=(--root . --object-directory build/ci-linux-coverage
            --filter 'core/' --filter 'Editor/code/'
            --exclude 'lib3dparty/' --exclude 'tests/' --exclude 'build/' --exclude '.fetchcontent-cache/'
            --exclude-unreachable-branches --exclude-throw-branches
            --merge-mode-functions=separate
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file
            --gcov-ignore-errors=no_working_dir_found
            -j "$(nproc)")
          gcovr "${gcovr_args[@]}" --txt build/coverage/coverage.txt --print-summary \
            --json-summary build/coverage/summary.json \
            --html-details build/coverage/index.html
          {
            python3 .github/scripts/coverage_summary.py build/coverage/summary.json
            echo
            echo '<details><summary>Per-file report</summary>'
            echo
            echo '```'
            cat build/coverage/coverage.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage
          if-no-files-found: warn

      - name: Fail if unit tests failed
        if: env.UNIT_TESTS_EXIT != '0'
        run: |
          echo "unit_tests exited with ${UNIT_TESTS_EXIT}"
          exit 1

  # Starts the editor on levels/smoke_level.desc under Xvfb + Mesa llvmpipe and checks that it
  # survives, logs no errors and actually draws the scene (tools/headless/check_smoke.sh).
  editor-smoke:
    name: Editor visual smoke (Linux)
    runs-on: ubuntu-latest

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      EDITOR_BIN: ${{ github.workspace }}/build/ci-linux-gcc-debug/Editor/editor

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev \
            xvfb libgl1-mesa-dri xdotool imagemagick

      # Same preset (and so the same cache key) as the Linux GCC Debug job: its objects are reused.
      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-ci-linux-gcc-debug

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        run: cmake --preset ci-linux-gcc-debug "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build editor
        run: cmake --build build/ci-linux-gcc-debug --target editor --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Smoke run (smoke_level)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --seconds 20 --size 1600x900 --shot headless_out/smoke/final.png \
            -- --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/smoke/final.png headless_out/smoke/editor.log

      # Click-driven scenario (zoom, select, toolbar, light selection); a crash or error log fails it.
      - name: Smoke run (checklist actions)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --actions tools/headless/smoke_checklist.actions --size 1920x1080 \
            --shot headless_out/checklist/final.png \
            -- --set editor/startup_level levels/smoke_level.desc
          tools/headless/check_smoke.sh headless_out/checklist/final.png headless_out/checklist/editor.log \
            200x200+860+450 0

      # Game view opened at startup (editor/show_game_view): it docks to the right half of the central
      # area and must show the "Game Camera" of smoke_level, so a crop of that panel cannot be flat.
      - name: Smoke run (Game view)
        run: |
          tools/run_headless.sh --editor "$EDITOR_BIN" --seconds 20 --size 1600x900 --shot headless_out/game_view/final.png \
            -- --set editor/startup_level levels/smoke_level.desc editor/show_game_view true
          tools/headless/check_smoke.sh headless_out/game_view/final.png headless_out/game_view/editor.log \
            200x200+940+260 0.03

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-smoke
          path: headless_out
          if-no-files-found: warn

  # Installs the SDK (cmake --install, package `snake_sdk`) and builds tests/package_consumer
  # against it with find_package: proves the export set is complete and self-contained (third-party
  # libraries are bundled). Static and shared (SNK_ENGINE_SHARED) engine.
  sdk-package:
    name: SDK package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            preset: ci-linux-gcc-debug
          - name: shared
            preset: ci-linux-shared

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      SDK_PREFIX: ${{ github.workspace }}/sdk-install

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-sdk-${{ matrix.preset }}

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ubuntu-latest-Debug-g++-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      # snk_sdk builds exactly the targets the install step copies.
      - name: Build SDK targets
        run: cmake --build build/${{ matrix.preset }} --target snk_sdk --parallel

      - name: Compiler cache statistics
        if: always()
        run: ccache -s

      - name: Install SDK
        run: cmake --install build/${{ matrix.preset }} --prefix "${SDK_PREFIX}"

      - name: Check the package does not point into the build or source tree
        run: |
          find "${SDK_PREFIX}/lib/cmake/snake_sdk" -type f | sort
          if grep -rIn -e "${GITHUB_WORKSPACE}" "${SDK_PREFIX}/lib/cmake"; then
            echo "::error::installed package config references the workspace"
            exit 1
          fi

      - name: Configure consumer
        run: |
          cmake -S tests/package_consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=${SDK_PREFIX}"

      - name: Build consumer
        run: cmake --build build/consumer

      - name: Run consumer
        run: build/consumer/package_consumer

  # The Windows variant of the shared SDK: snk_engine.dll goes to bin/, the import library to
  # lib/snk/, and the consumer copies the DLL next to its executable (no rpath on Windows).
  sdk-package-windows:
    name: SDK package (Windows shared)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    env:
      FC_DIR: ${{ github.workspace }}/.fetchcontent-cache
      SDK_PREFIX: ${{ github.workspace }}/sdk-install
      PRESET: ci-windows-msvc-shared

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up compiler cache
        uses: ./.github/actions/compiler-cache
        with:
          key: cc-sdk-ci-windows-msvc-shared

      - name: Cache FetchContent (Boost)
        uses: actions/cache@v4
        with:
          path: ${{ env.FC_DIR }}
          key: fc-ci-windows-msvc-shared-${{ hashFiles('cmake/ThirdParty.cmake') }}

      - name: Configure
        run: cmake --preset "${PRESET}" "-DFETCHCONTENT_BASE_DIR=${FC_DIR}"

      - name: Build SDK targets
        run: cmake --build "build/${PRESET}" --target snk_sdk --parallel

      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v sccache >/dev/null; then sccache --show-stats; fi

      - name: Install SDK
        run: cmake --install "build/${PRESET}" --prefix "${SDK_PREFIX}"

      - name: Check the installed layout
        run: |
          find "${SDK_PREFIX}/bin" "${SDK_PREFIX}/lib/cmake/snake_sdk" -type f | sort
          test -f "${SDK_PREFIX}/bin/snk_engine.dll"
          test -f "${SDK_PREFIX}/lib/snk/snk_engine.lib"
          ws="$(cygpath -m "${GITHUB_WORKSPACE}")"
          if grep -rIn -e "${ws}" "${SDK_PREFIX}/lib/cmake"; then
            echo "::error::installed package config references the workspace"
            exit 1
          fi

      - name: Configure consumer
        run: |
          cmake -S tests/package_consumer -B build/consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_PREFIX_PATH=${SDK_PREFIX}"

      - name: Build consumer
        run: cmake --build build/consumer

      - name: Run consumer
        run: build/consumer/package_consumer.exe
