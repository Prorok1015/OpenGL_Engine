resource:
    base_path: ../../core/res/
    # Without --project (EPIC-42 #157): the in-repo test project's content, as before it moved out of Editor/res.
    path: ../../projects/sandbox/res/

editor:
    data_path: ../data/

logger:
    # Relative log paths are taken from the log root, not from the current folder (#713): <project>/.cache with a project
    # open (.cache/logs/engine.log), else the user's log folder (%LOCALAPPDATA%\Snake, $XDG_STATE_HOME/snake).
    file: logs/engine.log
    level: debug
    category_file:
        edt:
            import: logs/edt_import.log
